  <title>MaxMAI — Coming soon</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #07151b;
      --lime: #d7f76f;
      --white: #f4f7f4;
      --muted: #a2b4b9;
    }
    * { box-sizing: border-box; }
    html { min-width: 280px; min-height: 100%; background: var(--ink); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--white);
      font-family: "Manrope", "Aptos", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse at 78% 14%, rgba(110, 149, 91, .12), transparent 50%),
        radial-gradient(ellipse at 10% 82%, rgba(34, 92, 103, .12), transparent 48%),
        var(--ink);
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--lime); outline-offset: 7px; }
    .page {
      width: min(1280px, calc(100% - 96px));
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
    }
    .header { padding-block: 36px; border-bottom: 1px solid rgba(214, 233, 226, .12); }
    .brand { display: inline-flex; align-items: center; gap: 12px; }
    .brand-symbol { width: 35px; height: 35px; color: var(--lime); flex: none; }
    .brand-name { font-size: 28px; font-weight: 600; letter-spacing: -.055em; }
    .brand-ai { color: var(--lime); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 76px 0 90px;
    }
    .content { width: 100%; max-width: 950px; text-align: center; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 30px;
      padding: 9px 14px;
      border: 1px solid rgba(215, 247, 111, .24);
      border-radius: 99px;
      color: var(--lime);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    h1 {
      margin: 0;
      font-size: clamp(40px, 5.6vw, 76px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -.055em;
      text-wrap: balance;
    }
    h1 span { display: block; color: var(--lime); }
    .intro { margin: 27px 0 0; color: var(--muted); font-size: 17px; line-height: 1.7; }
    .contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 19px;
      min-height: 50px;
      margin-top: 34px;
      padding: 13px 21px;
      border: 1px solid rgba(215, 247, 111, .5);
      border-radius: 4px;
      color: var(--lime);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      text-decoration: none;
      transition: background-color .18s, border-color .18s, color .18s;
    }
    .contact svg { width: 18px; height: 18px; flex: none; }
    .contact:hover { color: var(--ink); border-color: var(--lime); background: var(--lime); }
    footer { border-top: 1px solid rgba(214, 233, 226, .12); padding-block: 24px; }
    footer p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    @media (max-width: 640px) {
      .page { width: calc(100% - 48px); }
      .header { padding-block: 25px; }
      .brand-symbol { width: 30px; height: 30px; }
      .brand-name { font-size: 25px; }
      main { padding: 65px 0 75px; }
      h1 { font-size: clamp(36px, 8.8vw, 55px); line-height: 1.13; }
      .status { margin-bottom: 26px; }
      .intro { margin-top: 24px; font-size: 16px; }
      .contact { margin-top: 29px; }
      footer { padding-block: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { .contact { transition: none; } }
    @media (forced-colors: active) { .contact, .status { border-color: LinkText; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand" aria-label="MaxMAI">
        <svg class="brand-symbol" viewBox="0 0 40 40" fill="currentColor" aria-hidden="true">
          <path d="M18 3H14C7.925 3 3 7.925 3 14V18H10.5V14C10.5 12.067 12.067 10.5 14 10.5H18Z"/>
          <path d="M18 3H14C7.925 3 3 7.925 3 14V18H10.5V14C10.5 12.067 12.067 10.5 14 10.5H18Z" transform="rotate(90 20 20)"/>
          <path d="M18 3H14C7.925 3 3 7.925 3 14V18H10.5V14C10.5 12.067 12.067 10.5 14 10.5H18Z" transform="rotate(180 20 20)"/>
          <path d="M18 3H14C7.925 3 3 7.925 3 14V18H10.5V14C10.5 12.067 12.067 10.5 14 10.5H18Z" transform="rotate(270 20 20)"/>
          <rect x="16.5" y="16.5" width="7" height="7" rx="1.5" transform="rotate(45 20 20)"/>
        </svg>
        <span class="brand-name">MaxM<span class="brand-ai">AI</span></span>
      </div>
    </header>
    <main>
      <div class="content">
        <p class="status">Coming soon</p>
        <h1>Foundational intelligence<span>for better medicine.</span></h1>
        <p class="intro">Our full website is on its way.</p>
        <a class="contact" href="mailto:hello@maxmai.com" aria-label="Email MaxMAI at hello@maxmai.com">
          hello@maxmai.com
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 7h10v10M7 17 17 7"/>
          </svg>
        </a>
      </div>
    </main>
    <footer><p>&copy; 2026 MaxMAI</p></footer>
  </div>
